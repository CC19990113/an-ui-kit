name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支的新提交取消旧跑，省时间也不看中间态。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node 26 / pnpm 10.33)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm

      # 1. 只认根 lockfile，保证可复现。
      - name: Install
        run: pnpm install --frozen-lockfile

      # 2. tokens 必须最先构建：elements 的类型与产物依赖它的 dist/。
      - name: Build tokens
        run: pnpm --filter @an-ui-kit/tokens build

      # 3. 类型层（含 React 事件名、Vue augmentation、CEM 派生类型）。
      - name: Typecheck elements
        run: pnpm --filter @an-ui-kit/elements typecheck

      # 4. 组件产物。
      - name: Build elements
        run: pnpm --filter @an-ui-kit/elements build

      # 5. 单元测试 + 覆盖率门禁。阈值写在 test/vitest.config.ts 的
      #    coverage.thresholds 里（v8 统计 src/**/*.ts），低于任一项 vitest
      #    直接非零退出，所以这一步同时是覆盖率断言。
      - name: Test elements (coverage)
        run: pnpm --filter @an-ui-kit/elements test:coverage

      # 5b. 报告产物断言：上面写了 text + json-summary 两个 reporter，这里确认
      #     json-summary 真的落盘并打印四项数字（阈值的判定仍在 5 的 vitest 里）。
      - name: Assert coverage summary
        run: |
          node -e "
          const fs = require('node:fs');
          const file = 'packages/elements/coverage/coverage-summary.json';
          if (!fs.existsSync(file)) {
            console.error('coverage-summary.json 缺失：coverage reporter 没生效');
            process.exit(1);
          }
          const { total } = JSON.parse(fs.readFileSync(file, 'utf8'));
          const rows = ['lines', 'statements', 'functions', 'branches'];
          const empty = rows.filter((key) => !(total[key] && Number(total[key].pct) > 0));
          for (const key of rows) {
            console.log(
              key.padEnd(10),
              String(total[key]?.pct ?? 'n/a').padStart(6),
              '%  (' + total[key]?.covered + '/' + total[key]?.total + ')',
            );
          }
          if (empty.length > 0) {
            console.error('覆盖率报告里这些项为空: ' + empty.join(', '));
            process.exit(1);
          }
          "

      # 6. CEM 是 AI 层（registry / MCP / skill）唯一的契约源。这一步重新扫描
      #    源码，与提交进仓库的 custom-elements-manifest.json 逐字节比对：改了组件
      #    JSDoc 却忘了跑 `pnpm cem` 时，前面几步全绿而这里必须红。
      #    放在单测之后：源码先定稿，再证明提交进去的契约确实是新生成的。
      - name: Assert CEM is fresh
        run: node scripts/ci/assert-cem-fresh.mjs

      # 7. registry 由 CEM + 源码派生，必须紧跟 CEM 检查：CEM 确认新鲜后，
      #    再证明 registry/*.json 的 meta 与 files 确实是它派生的（CEM 一过期，
      #    这里会连带报同样的因）。
      - name: Assert registry is in sync
        run: node scripts/check-registry.mjs

      # 8. skill（SKILL.md + references/）是给人/agent 读的契约，最容易忘记同步。
      #    放在 6/7 之后：CEM 与 registry 都确认新鲜后，这里的报错才明确指向
      #    skill 自己过期，而不是上游 CEM 过期。
      - name: Assert skill is in sync with CEM
        run: node scripts/ci/assert-skill-sync.mjs

      # 9. 零运行时依赖红线：每个 packages/* 的 dependencies 必须是空对象。
      - name: Assert zero runtime dependencies
        run: node scripts/ci/assert-empty-deps.mjs

      # 10. 公开历史里不能出现公司邮箱。
      - name: Assert git author is not @shenshiads.com
        run: node scripts/ci/assert-author.mjs

      # 11. 体积预算：全量单入口 dist/index.js 的 gzip ≤ 4096B 基线 + 2560B × 组件数。
      #     组件数从源码扫描，加组件时预算自动跟着涨，衡量的是单个组件的成本。
      - name: Assert gzip budget
        run: node scripts/ci/assert-bundle-size.mjs

      # 12. 裁剪构建断言：配置只点名 an-button 时，产物必须更小、且完全不含
      #     an-input 的标签与类名。全程用临时目录，不污染 dist/，也不改仓库里的
      #     an-ui-kit.config.json。
      - name: Assert custom build trims unused components
        run: node scripts/ci/assert-custom-build.mjs

      # 13. MCP 构建会把仓库根的 custom-elements-manifest.json 原样 copy 成
      #     packages/mcp/manifest.json，所以必须排在 6（CEM 新鲜度）之后：
      #     否则可能把过期契约打进 MCP 产物，而且这里一过就没人再查了。
      - name: Build MCP
        run: pnpm --filter @an-ui-kit/mcp build

      # 14. CLI 构建：@an-ui-kit/cli 是给使用者按配置裁剪单文件产物的构建工具，
      #     和 MCP 一样发布前必须有 dist/cli.js（package.json 的 bin 指向它）。
      #     CLI 只读 @an-ui-kit/elements 的 src/，不依赖上一步的 dist。
      - name: Build CLI
        run: pnpm --filter @an-ui-kit/cli build

      - name: Typecheck demo consumer contracts
        run: pnpm --filter demo typecheck

      # 15. 契约工具的行为测试：读的正是 Build MCP 上一步 copy 的新鲜 manifest，全绿才算
      #     AI 层可用。放在 Build MCP 之后（测试依赖 dist/server.js 与 manifest.json）。
      - name: Test MCP
        run: pnpm --filter @an-ui-kit/mcp test

      # 16. CLI 端到端测试：spawn dist/cli.js 跑 list / init / generate，验证裁剪
      #     产物的组件命中与 ESM 可执行性。放在 Build CLI 之后（测试依赖 dist/cli.js）。
      - name: Test CLI
        run: pnpm --filter @an-ui-kit/cli test

  # 浏览器 e2e 独立成一个 job：三浏览器（chromium / webkit / firefox）需要各自
  # 下载 ~150MB 的构建，和 verify 的纯 Node 校验并行跑，互不拖慢。
  e2e:
    name: e2e (chromium / webkit / firefox)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # demo 走 `vite build` 打包 @an-ui-kit/elements，所以两个上游 dist 必须先就绪。
      - name: Build tokens
        run: pnpm --filter @an-ui-kit/tokens build

      - name: Build elements
        run: pnpm --filter @an-ui-kit/elements build

      # 用 demo 自己的 playwright 可执行文件安装，保证浏览器 revision 与
      # apps/demo 锁定的 1.65.1 一致（`npx playwright install` 会临时拉最新版，
      # rev 可能对不上）。CI 不依赖系统 Chrome 兜底，三个 project 都必须真跑。
      - name: Install Playwright browsers
        run: pnpm --filter demo exec playwright install --with-deps chromium webkit firefox

      # playwright.config.ts 的 webServer 会先 build 再 vite preview；
      # 三个 project 重复跑同一套 native / react / vue / tailwind 断言。
      # 这里不点名 spec：testMatch = **/*.e2e.ts，所以 e2e/a11y-axe.e2e.ts
      # （axe 全量扫描）与 e2e/theme-dark.e2e.ts（深色模式）自动包含在内。
      - name: E2E (three frameworks x three browsers, incl. axe + dark mode)
        run: pnpm --filter demo e2e
