name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支的新提交取消旧跑，省时间也不看中间态。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node 26 / pnpm 10.33)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm

      # 1. 只认根 lockfile，保证可复现。
      - name: Install
        run: pnpm install --frozen-lockfile

      # 2. tokens 必须最先构建：elements 的类型与产物依赖它的 dist/。
      - name: Build tokens
        run: pnpm --filter @x/tokens build

      # 3. 类型层（含 React 事件名、Vue augmentation、CEM 派生类型）。
      - name: Typecheck elements
        run: pnpm --filter @x/elements typecheck

      # 4. 组件产物。
      - name: Build elements
        run: pnpm --filter @x/elements build

      # 5. 单元测试。
      - name: Test elements
        run: pnpm --filter @x/elements test

      # 6. 零运行时依赖红线：每个 packages/* 的 dependencies 必须是空对象。
      - name: Assert zero runtime dependencies
        run: node scripts/ci/assert-empty-deps.mjs

      # 7. 公开历史里不能出现公司邮箱。
      - name: Assert git author is not @shenshiads.com
        run: node scripts/ci/assert-author.mjs

      # 8. 体积预算：dist/index.js gzip ≤ 3072B。
      - name: Assert gzip budget
        run: node scripts/ci/assert-bundle-size.mjs

      # 9. 装 Playwright 自带 Chromium。用 demo 自己的 playwright 可执行文件安装，
      #    保证浏览器 revision 与 apps/demo 锁定的 1.65.1 一致（`npx playwright install`
      #    会临时拉最新版，rev 可能对不上）。CI 不依赖系统 Chrome 兜底。
      - name: Install Playwright browser
        run: pnpm --filter demo exec playwright install --with-deps chromium

      # 10. 三框架 e2e：native / react / vue + Tailwind preflight。
      #     放在 9 之后（浏览器已就绪），并依赖前面 @x/elements 的构建产物。
      - name: E2E (three frameworks)
        run: pnpm --filter demo e2e
