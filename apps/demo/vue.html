  <body>
    <main>
      <h1>&lt;x-button&gt; · Vue 3</h1>
      <p class="hint">
        用 <code>app.config.compilerOptions.isCustomElement = (tag) =&gt; tag.startsWith('x-')</code>
        告诉编译器 <code>x-*</code> 是原生自定义元素；模板里写
        <code>&lt;x-button @x-button-click="..."&gt;</code>。
      </p>
      <div id="app"></div>
    </main>
    <script type="module" src="./vue.ts"></script>
