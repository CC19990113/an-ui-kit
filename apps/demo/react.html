  <body>
    <main>
      <h1>&lt;an-button&gt; · React 19</h1>
      <p class="hint">
        事件 prop 写 <code>onan-button-click</code>（React 19 对自定义元素的事件名<strong>原样</strong>传给
        <code>addEventListener</code>，不做 camelCase 转换；<code>an-button-click</code> 本身全小写，所以
        prop 就是这个名字）。写成 <code>onAnButtonClick</code> 会 TS 报错，见
        <code>src/event-name.type-test.tsx</code>。
      </p>
      <div id="root"></div>
    </main>
